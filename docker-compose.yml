services:
  # O init.sql cria também o banco de testes, para a suíte e2e nunca encostar
  # nos dados de desenvolvimento.
  db:
    image: postgres:18-alpine
    container_name: kpmg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpmg
      POSTGRES_PASSWORD: kpmg
      POSTGRES_DB: kpmg
    ports:
      - "5432:5432"
    volumes:
      # No Postgres 18 o volume fica na raiz, e não mais em /data.
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Backend e frontend rodam fora do Compose, então este healthcheck serve
      # ao `docker compose up --wait` e ao `make setup`, que só seguem para as
      # migrations depois que o banco aceita conexão.
      test: ["CMD-SHELL", "pg_isready -U kpmg -d kpmg"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de desenvolvimento: captura o que a aplicação envia e mostra
  # numa caixa de entrada em http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.28
    container_name: kpmg-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
