name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kpmg
          POSTGRES_PASSWORD: kpmg
          # O e2e usa este banco; o .env.test.example já aponta para ele.
          POSTGRES_DB: kpmg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpmg -d kpmg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      # Não há SMTP na CI: a suíte e2e substitui o MailService por um dublê e a
      # unitária faz mock do nodemailer, então nenhuma conexão real é aberta.
      - name: Preparar variáveis de ambiente de teste
        run: cp .env.test.example .env.test

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm test

      # O globalSetup aplica as migrations no banco de testes antes da suíte.
      - name: Testes e2e
        run: npm run test:e2e

      - name: Cobertura
        run: npm run test:cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
